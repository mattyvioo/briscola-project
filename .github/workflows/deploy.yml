name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them and drop superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vite 8 requires ^20.19 || >=22.12
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          # npm writes the real failure reason to its debug log rather than
          # stdout, so surface it here instead of leaving a bare exit code.
          npm ci --no-audit --no-fund || {
            echo "::group::npm debug log"
            tail -n 150 "$(npm config get cache)"/_logs/*.log 2>/dev/null || echo "(no debug log written)"
            echo "::endgroup::"
            exit 1
          }

      # Cheap (<1s) and catches a broken rules engine before it ships.
      - run: npm test

      # Runs tsc --noEmit and then vite build.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
